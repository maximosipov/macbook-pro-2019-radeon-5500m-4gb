# LFM2.5-2.6B — the fastest and smallest model measured here.
#
# 58.3 tok/s generation (fastest in the set) and 1.84 GB resident (smallest),
# so it leaves the most room for context. Its short-convolution hybrid design
# keeps state small, and its SSM_CONV path is correct on this MoltenVK stack.
# It emits proper tool_calls (0.69 BFCL AST), a tier below Granite.
#
# Fit: 1.84 GB weights against 4278 MB usable — the most headroom of any model
# here. Weights: LiquidAI/LFM2.5-2.6B-GGUF on Hugging Face.

name: lfm2.5-2.6b
backend: llama-cpp
description: LFM2.5 2.6B (short-conv hybrid, 128K context, q4_0 KV). Fastest and smallest model on this machine.

parameters:
  model: LFM2.5-2.6B-Q4_K_M.gguf

# Its whole trained window, measured: 131072 runs at 56.4 t/s, above its own 4K
# baseline and the fastest figure taken on this machine at any context. Most
# layers are gated short convolutions rather than attention, so the cache stays
# small. It fits 128K even at f16 KV.
#
# Caveat: it scores 0.000 on MRCR, so a wide window does not mean it can recall
# across one. Do not pick this model for long-history work.
context_size: 131072

gpu_layers: 99
f16: true
flash_attention: "true"
cache_type_k: q4_0
cache_type_v: q4_0

# This model emits a reasoning preamble by default, which is slow on this card
# and overruns short answer budgets. Uncomment to turn thinking off, if the
# chat template accepts the kwarg:
# chat_template_kwargs:
#   enable_thinking: false
