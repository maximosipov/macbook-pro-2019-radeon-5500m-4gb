# d1-2B is a decision model, not a chat model. Text decisions only here.
# The default 512-token physical batch limits each rendered question. A 4096-token
# batch lost the Radeon device during a long JevBench case; see decision-models.md.
name: d1-2b
backend: llama-cpp
description: Liquid AI d1-2B decision model, Q4_K_M.
known_usecases:
  - decisions
parameters:
  model: d1-2B-Q4_K_M.gguf
context_size: 8192
gpu_layers: 99
flash_attention: "true"
