# Qwen3.5-4B — the reasoning pick.
#
# Best maths and science scores measured here (MATH-500 0.81, GPQA-Diamond
# 0.56), and 0.75 BFCL AST. It is the slowest of the four at 33.6 tok/s, and
# its Gated DeltaNet prefill is a sequential scan, which is expensive through
# MoltenVK — so long prompts cost more than the generation rate suggests.
#
# Fit: 3.05 GB of weights against 4278 MB usable. Heavy on weights but light on
# cache, so it still reaches 96K. Leave it alone in the session.

name: qwen3.5-4b
backend: llama-cpp
description: Qwen3.5 4B (Gated DeltaNet hybrid, 96K context, q4_0 KV). Best maths and reasoning on this machine.

parameters:
  model: Qwen3.5-4B-Q4_K_M.gguf

# Measured ceiling. The Gated DeltaNet hybrid keeps only ~8 of 32 layers as
# attention, so 98304 holds at full speed (31.0 t/s against 31.1 at 4K).
# 131072 spills and collapses to 1.2 t/s, well short of the 256K it was
# trained for.
context_size: 98304

gpu_layers: 99
f16: true
flash_attention: "true"
cache_type_k: q4_0
cache_type_v: q4_0

# A thinking model: content stays empty until the think block closes, and the
# chain of thought arrives in message.reasoning. That is normal, not GPU
# corruption. Thinking is slow on this card; uncomment to disable it, if the
# chat template accepts the kwarg:
# chat_template_kwargs:
#   enable_thinking: false
