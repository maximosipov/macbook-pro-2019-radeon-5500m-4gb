# d1-2B image decisions on CPU; see localai.md#lfm3-and-d1-2b.
# Requires both official GGUFs. Tested on one chart image. LocalAI video is
# unsupported: a small video in `files` was silently ignored in testing.
# Each rendered question and image must fit the 1024-token physical batch.
name: d1-vision-cpu
backend: llama-cpp
description: Liquid AI d1-2B image and text decision model, Q4_K_M with F16 projector, CPU.
known_usecases:
  - decisions
parameters:
  model: d1-2B-Q4_K_M.gguf
  batch: 1024
mmproj: mmproj-d1-2B-F16.gguf
context_size: 2048
gpu_layers: 0
threads: 2
options:
  - "mmproj_use_gpu:false"
