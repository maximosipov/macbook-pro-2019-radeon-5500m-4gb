# Granite-4.0-H-Micro — the unattended / agent pick.
#
# Best tool-calling behaviour measured on this machine (24/24 on the custom set
# including the negative cases, 0.86 BFCL AST). Its Mamba-2 hybrid design keeps
# only 4 of 40 layers as attention, so the KV cache grows at ~8 KiB/token and a
# wide context costs almost nothing in VRAM.
#
# Fit: 1.95 GB weights + ~288 MB KV at 32K/q4_0, against 4278 MB usable.
# Speed: ~35 tok/s generation; served warm it measured 27.8 / 32.5 / 32.3 tok/s.
# See models.md and localai.md in this repository.

name: granite-4.0-h-micro
backend: llama-cpp
description: Granite 4.0 H-Micro (Mamba-2 hybrid, 128K context, q4_0 KV). Best tool calling on this machine.

parameters:
  model: granite-4.0-h-micro-Q4_K_M.gguf

# Its whole trained window, measured: 131072 runs at 40.5 t/s, above its own
# 4K baseline. Only 4 of 40 layers are attention, so the cache grows at about
# 8 KiB/token and VRAM never becomes the limit — the model runs out of trained
# context first. Nothing is gained by setting this lower.
context_size: 131072

gpu_layers: 99            # all layers on the Radeon; anything less pays a PCIe hop per token
f16: true
flash_attention: "true"   # runs on the GPU on these branches, and is required for a quantized KV cache
cache_type_k: q4_0        # ~4% slower than f16, and 3.5x more context
cache_type_v: q4_0
